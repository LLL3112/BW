name: Scrape Belgrade Waterfront listings

# GitHub-hosted runners (ubuntu-latest) get an immediate HTTP 403 from
# halooglasi.com on every request — a WAF/edge rule blocking well-known
# cloud/datacenter IP ranges, confirmed in run 30047782928 (real Playwright
# browser, still 403 with an empty body on the very first attempt of every
# category). So this runs on a self-hosted runner instead (a normal browser
# from a normal IP), started manually — see README for the one-time runner
# setup + the "run a fresh scrape" steps.
#
# GitHub Pages is "Deploy from a branch" (docs/ folder), so GitHub publishes
# the dashboard itself whenever this workflow pushes new commits to docs/ —
# no separate Pages-deploy job needed here.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # actions/setup-python tries to write Windows Registry entries as part
      # of installing its own copy of Python, which needs elevation and fails
      # on a non-admin self-hosted Windows runner (confirmed in run
      # 30079529615: "Error happened during Python installation" after "Remove
      # registry entries for Python..."). Use whatever Python is already on
      # the runner's PATH instead — `python -m pip`/`python -m playwright`
      # avoid depending on separate pip.exe/playwright.exe shims being on PATH.
      - name: Check Python is available
        run: python --version

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright's Chromium
        run: python -m playwright install chromium

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push data
        shell: bash  # the self-hosted runner may be Windows, where run: steps default to PowerShell
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update BW listings data - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
