name: Scrape Belgrade Waterfront listings

# GitHub Pages is configured as "Deploy from a branch" (docs/ folder), so
# GitHub publishes the dashboard itself whenever this workflow pushes new
# commits to docs/ — no separate Pages-deploy job needed here.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium
        run: playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update BW listings data - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
